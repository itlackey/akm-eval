version: 2
name: web-ux-validation-gate-program
description: |
  YAML workflow-program version of the Web UX Validation Gate. Preserves the
  same binary PASS/FAIL policy, deterministic floor-first order, three-judge
  review model, decision record, and escalation rules as the markdown workflow.

params:
  ui_dir:
    type: string
    description: Absolute path to the UI package where playwright and the audit tooling resolve.
  audit_config:
    type: string
    description: Absolute path to the ux-dom-audit config JSON file.
  base_url:
    type: string
    description: Origin of the live UI under test.
  password_env_value:
    type: string
    description: Instructions for how to obtain the login password without hard-coding it.
  change_summary:
    type: string
    description: One paragraph describing the UI change and intended design outcome.
  task_list:
    type: string
    description: Operator tasks or cognitive-walkthrough task list for the IA/flow judge.
  out_dir:
    type: string
    description: Absolute directory where findings, screenshots, and decision artifacts are written.
  max_iterations:
    type: integer
    minimum: 1
    description: Maximum fix to gate cycles before escalation.

defaults:
  timeout: 15m
  on_error: fail

steps:
  - id: rule
    title: The Rule
    unit:
      instructions: |
        Read and internalize the governing policy for this gate before doing any work.

        1. The gate is binary PASS or FAIL. There is no "passes with minor tweaks".
        2. Floor first, un-gameable. Run the deterministic floor before judges. If any P0
           finding exists, the gate is FAIL immediately and judges are not dispatched.
        3. Three independent judges, AND-gate. If the floor is clean, dispatch the
           accessibility, IA/flow, and visual judges independently. All three must pass.
        4. Any single judge FAIL or INSUFFICIENT EVIDENCE means FAIL until resolved.
        5. The orchestrator may only withhold a pass. It may never launder a floor or judge
           failure into PASS.
        6. The implementer must not act as a judge.
        7. This workflow exists to prevent self-graded UI approvals from shipping measurable defects.

        Return a short JSON acknowledgement that the binary policy and sequencing rules were understood.
      output:
        type: object
        properties:
          acknowledged: { type: boolean }
          summary: { type: string }
        required: [acknowledged, summary]
    output:
      type: object
      properties:
        acknowledged: { type: boolean }
        summary: { type: string }
      required: [acknowledged, summary]
    gate:
      criteria:
        - Binary policy, floor-first ordering, judge AND-gate, and orchestrator withhold-only authority are explicit.

  - id: required_inputs
    title: Required Inputs
    unit:
      instructions: |
        Validate the required inputs and toolchain.

        Inputs:
        - ui_dir: ${{ params.ui_dir }}
        - audit_config: ${{ params.audit_config }}
        - base_url: ${{ params.base_url }}
        - password_env_value: ${{ params.password_env_value }}
        - change_summary: ${{ params.change_summary }}
        - task_list: ${{ params.task_list }}
        - out_dir: ${{ params.out_dir }}
        - max_iterations: ${{ params.max_iterations }}

        Do the following:
        1. Confirm every required parameter is present and non-empty.
        2. Confirm the base_url exactly matches the dev server origin that will be tested.
        3. Confirm playwright and @axe-core/playwright resolve from ui_dir.
        4. Confirm the measurable UX rubric, ux-dom-audit skill, and the three judge agents are available.
        5. Treat empty change_summary or task_list as invalid.

        Return JSON recording whether the inputs are valid and any blockers.
      output:
        type: object
        properties:
          valid: { type: boolean }
          blockers:
            type: array
            items: { type: string }
          notes: { type: string }
        required: [valid, blockers, notes]
    output:
      type: object
      properties:
        valid: { type: boolean }
        blockers:
          type: array
          items: { type: string }
        notes: { type: string }
      required: [valid, blockers, notes]
    gate:
      criteria:
        - All params are present, tooling resolves, and rubric plus judges are available.

  - id: floor
    title: Stage 1 Floor
    unit:
      instructions: |
        Run the deterministic capture and floor.

        Inputs:
        - ui_dir: ${{ params.ui_dir }}
        - audit_config: ${{ params.audit_config }}
        - base_url: ${{ params.base_url }}
        - password_env_value: ${{ params.password_env_value }}
        - out_dir: ${{ params.out_dir }}

        Required behavior:
        1. Ensure the UI is serving at base_url. Start it from ui_dir only if required, and record whether this run started it.
        2. Generate a runId and generatedAt.
        3. Run the ux-dom-audit from ui_dir with the proper environment.
        4. Confirm findings.json and shots/ exist.
        5. If summary.P0 > 0, record that the gate FAILS immediately and judges must not be dispatched.
        6. If summary.P0 == 0, record that judges may proceed.
        7. Verify every selector referenced by findings has corresponding screenshot evidence.

        Return JSON with run_id, generated_at, findings_path, screenshot_dir, p0_count, and whether judges may proceed.
      output:
        type: object
        properties:
          run_id: { type: string }
          generated_at: { type: string }
          findings_path: { type: string }
          screenshot_dir: { type: string }
          p0_count: { type: integer }
          proceed_to_judges: { type: boolean }
          notes: { type: string }
        required: [run_id, generated_at, findings_path, screenshot_dir, p0_count, proceed_to_judges, notes]
    output:
      type: object
      properties:
        run_id: { type: string }
        generated_at: { type: string }
        findings_path: { type: string }
        screenshot_dir: { type: string }
        p0_count: { type: integer }
        proceed_to_judges: { type: boolean }
        notes: { type: string }
      required: [run_id, generated_at, findings_path, screenshot_dir, p0_count, proceed_to_judges, notes]
    gate:
      criteria:
        - The audit ran and produced findings.json plus screenshots.
        - P0 findings short-circuit the gate to FAIL without judges.

  - id: judges
    title: Stage 2 Judges
    unit:
      instructions: |
        Dispatch and collect the three independent judges if and only if the floor step reported proceed_to_judges=true.

        Carry forward:
        - findings path from the floor step
        - screenshots directory from the floor step
        - change_summary: ${{ params.change_summary }}
        - task_list: ${{ params.task_list }}
        - base_url: ${{ params.base_url }}

        Required behavior:
        1. Dispatch the accessibility, IA/flow, and visual judges independently in parallel.
        2. Require each judge to read the measurable UX rubric first.
        3. Treat INSUFFICIENT EVIDENCE as FAIL until the missing capture is produced.
        4. If any judge reports missing screenshot evidence for a selector, do not proceed to synthesis until the floor is rerun with that evidence.

        Return JSON with the three verdicts, whether evidence gaps were resolved, and the list of blocking findings.
      output:
        type: object
        properties:
          a11y_verdict: { type: string }
          ia_verdict: { type: string }
          visual_verdict: { type: string }
          evidence_gaps_resolved: { type: boolean }
          blocking_findings:
            type: array
            items: { type: string }
        required: [a11y_verdict, ia_verdict, visual_verdict, evidence_gaps_resolved, blocking_findings]
    output:
      type: object
      properties:
        a11y_verdict: { type: string }
        ia_verdict: { type: string }
        visual_verdict: { type: string }
        evidence_gaps_resolved: { type: boolean }
        blocking_findings:
          type: array
          items: { type: string }
      required: [a11y_verdict, ia_verdict, visual_verdict, evidence_gaps_resolved, blocking_findings]
    gate:
      criteria:
        - Three independent judge verdicts are collected before synthesis.

  - id: decision
    title: Decision Record
    unit:
      instructions: |
        Synthesize the final PASS or FAIL decision.

        Decision rules:
        1. FAIL if the floor found any P0 issue.
        2. Else FAIL if any judge verdict is FAIL or INSUFFICIENT EVIDENCE.
        3. Else PASS.
        4. The orchestrator may only override toward FAIL, never toward PASS.
        5. De-duplicate blocking findings into one prioritized backlog.
        6. Write decision.json to out_dir, including evidence_gaps_resolved.
        7. Stop the dev server if this run started it.

        Return JSON with status, decision_path, blocking_count, and top_blockers.
      output:
        type: object
        properties:
          status: { type: string }
          decision_path: { type: string }
          blocking_count: { type: integer }
          top_blockers:
            type: array
            items: { type: string }
        required: [status, decision_path, blocking_count, top_blockers]
    output:
      type: object
      properties:
        status: { type: string }
        decision_path: { type: string }
        blocking_count: { type: integer }
        top_blockers:
          type: array
          items: { type: string }
      required: [status, decision_path, blocking_count, top_blockers]
    gate:
      criteria:
        - decision.json is written with floor counts, judge verdicts, and backlog details.

  - id: iteration
    title: Iteration and Escalation
    unit:
      instructions: |
        Record the iteration policy for this gate.

        1. On FAIL, the implementer fixes the backlog and the gate restarts from the floor step.
        2. Respect max_iterations: ${{ params.max_iterations }}.
        3. If the same disqualifying finding survives 3 consecutive iterations, escalate instead of churning.
        4. Keep each iteration's decision.json for auditability.
        5. If escalation occurs, append escalation-log.md with the finding, iteration count, and next steps.

        Return JSON with next_action and escalation policy summary.
      output:
        type: object
        properties:
          next_action: { type: string }
          escalation_summary: { type: string }
        required: [next_action, escalation_summary]
    output:
      type: object
      properties:
        next_action: { type: string }
        escalation_summary: { type: string }
      required: [next_action, escalation_summary]
    gate:
      criteria:
        - Iteration cap and 3-strike escalation rules are explicit.

  - id: scope
    title: Scope Definition
    unit:
      instructions: |
        Record what changes count as web-UI changes for this gate.

        In scope:
        - components, routes, layouts, CSS, tokens, navigation, responsive rules,
          and copy that changes labels or affordances
        - authentication flows, including password visibility and error-message contrast

        Out of scope:
        - server-only logic with no rendered UI effect
        - CI and build config
        - docs that do not render in the UI
        - tests

        Return JSON with in_scope and out_of_scope summaries.
      output:
        type: object
        properties:
          in_scope: { type: string }
          out_of_scope: { type: string }
        required: [in_scope, out_of_scope]
    output:
      type: object
      properties:
        in_scope: { type: string }
        out_of_scope: { type: string }
      required: [in_scope, out_of_scope]
    gate:
      criteria:
        - Inclusion and exclusion rules for triggering the gate are explicit.
