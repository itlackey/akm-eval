name: Scheduled Smoke

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  locomo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: bun install

      - name: Install LoCoMo evaluator dependencies
        run: python -m pip install --upgrade pip -r requirements-smoke.txt

      - name: Download NLTK punkt
        run: python -c "import nltk; nltk.download('punkt', quiet=True)"

      - name: Run LoCoMo smoke
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: bun src/cli.ts run --pack locomo --variant baseline --config config/examples/locomo-smoke.json --out runs/ci-smoke/locomo

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locomo-smoke
          path: runs/ci-smoke/locomo
          if-no-files-found: ignore
