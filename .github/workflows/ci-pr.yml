name: PR CI

on:
  pull_request:
  # Also on pushes to main. Without this, CI ran on PRs ONLY, so a commit
  # landing on main directly was never checked: `093fbe4` switched the
  # longmemeval configs from `python` to `python3` and left
  # tests/config.test.ts asserting the old string, and main sat red
  # (20 pass / 1 fail) until someone happened to run the suite locally.
  # A gate that cannot observe the branch it protects is not a gate.
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # This job never sets AKM_EVAL_AKM_CMD, deliberately: it has no docker
    # daemon, no real akm CLI, and no sibling akm source checkout.
    # tests/memory-backend-akm.integration.test.ts skips its suite on exactly
    # one compound condition -- running in CI *and* AKM_EVAL_AKM_CMD unset --
    # so `bun test` below runs unmodified here without needing a real akm CLI.
    # The CI half of that condition is load-bearing: the suite still runs, and
    # still fails rather than skips, on developer machines, so this gate cannot
    # quietly turn the repo's only live-akm coverage into a no-op everywhere.
    # See that test file's header comment and docs/memory-backends.md
    # ("### Tests") for the full reasoning. Setting AKM_EVAL_AKM_CMD here opts
    # this job into the real suite -- only do that alongside provisioning a
    # real, reachable akm CLI for it.
    #
    # `actions/checkout` and `oven-sh/setup-bun` are pinned to major tags; the
    # bun version matches package.json's `packageManager` field (bun@1.3.13).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install

      - name: Run lint
        run: bun run lint

      - name: Run tests
        run: bun test

      - name: Run boundary check
        run: bun run check:boundary
