name: On-Demand Tests

on:
  workflow_dispatch:
    inputs:
      run_llm_tests:
        description: 'Also run the LLM-backed LoCoMo smoke test (requires the OPENAI_API_KEY secret)'
        type: boolean
        default: false

jobs:
  # Same non-LLM checks as ci-pr.yml, exposed here behind a manual trigger so
  # they can be re-run on demand outside of a PR/push. Deliberately does not
  # set AKM_EVAL_AKM_CMD -- see ci-pr.yml for why that is what lets
  # tests/memory-backend-akm.integration.test.ts skip safely in this job.
  non-llm-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install

      - name: Run lint
        run: bun run lint

      - name: Run tests
        run: bun test

      - name: Run boundary check
        run: bun run check:boundary

  # Opt-in only: runs when the caller explicitly ticks run_llm_tests on
  # workflow_dispatch. Mirrors the LoCoMo smoke path in smoke-schedule.yml,
  # but fails loudly instead of silently skipping when the key is missing,
  # since this run was explicitly requested rather than a scheduled cron.
  llm-smoke:
    needs: non-llm-tests
    if: ${{ github.event.inputs.run_llm_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: bun install

      - name: Install LoCoMo evaluator dependencies
        run: python -m pip install --upgrade pip -r requirements-smoke.txt

      - name: Download NLTK punkt
        run: python -c "import nltk; nltk.download('punkt', quiet=True)"

      - name: Check OPENAI_API_KEY is configured
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: |
          echo "run_llm_tests was requested but the OPENAI_API_KEY secret is not set on this repository." >&2
          exit 1

      - name: Run LoCoMo smoke
        run: bash bin/eval --pack locomo --variant baseline --config config/common/locomo-smoke.json --out runs/ci-smoke/locomo

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locomo-smoke
          path: runs/ci-smoke/locomo
          if-no-files-found: ignore
