# Runs scripts/check on every push and pull request: the measurement lock, the typecheck of every src folder, the Python suites and bun test.
# The measurement lock is the gate on what the evals measure: a change to an eval's collector or scorer fails the job until the version
# is bumped in MEASUREMENT.lock, with a row in MEASUREMENT_CHANGELOG.md (scripts/measurement/run bump).
# Every test uses a fake akm, so the job needs no akm, no Docker, no model and no secret. The job that runs the evals against a
# real akm is akm-smoke.yml.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # bun 1.4.2 is the release the folders' @types/bun is pinned to.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # uv runs the bakeoff suite and the tests of the akm arm in lib/harbor. Nothing is cached.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      # The measurement check first and on its own, so that a change nobody bumped shows as that, and not among the tests.
      - name: measurement lock
        run: scripts/check measurement

      - name: scripts/check
        run: scripts/check
