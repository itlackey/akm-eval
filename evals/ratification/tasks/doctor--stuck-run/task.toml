schema_version = "1.4"

[task]
name = "akm-eval/doctor--stuck-run"
version = "1.0.0"
description = "Inspect akm health and report the one problem it names"
authors = []
keywords = []

[metadata]
family = "doctor"
# How many akm calls the reference solution makes: the report counts akm calls beyond it as unnecessary.
ref_akm = 1
# A form this task invites that akm deprecated or removed, and the form that replaces it (regular expressions over a shell command).
old = "\\bakm\\s+health\\b"
replacement = "\\bakm\\s+doctor\\b"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
workdir = "/work"

[environment.env]
AKM_TASK_STASH = "doctor--stuck-run"
