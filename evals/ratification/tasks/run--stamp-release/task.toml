schema_version = "1.4"

[task]
name = "akm-eval/run--stamp-release"
version = "1.0.0"
description = "Run a task asset by ref"
authors = []
keywords = []

[metadata]
family = "run"
# How many akm calls the reference solution makes: the report counts akm calls beyond it as unnecessary.
ref_akm = 2
# A form this task invites that akm deprecated or removed, and the form that replaces it (regular expressions over a shell command).
old = "\\bakm\\s+task\\s+run\\b"
replacement = "\\bakm\\s+run\\b"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
workdir = "/work"

[environment.env]
AKM_TASK_STASH = "run--stamp-release"
