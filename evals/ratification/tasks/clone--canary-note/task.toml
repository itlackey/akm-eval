schema_version = "1.4"

[task]
name = "akm-eval/clone--canary-note"
version = "1.0.0"
description = "Clone a note under a new name and edit the copy (the obvious command is deprecated)"
authors = []
keywords = []

[metadata]
family = "recover"
# How many akm calls the reference solution makes: the report counts akm calls beyond it as unnecessary.
ref_akm = 1
# A form this task invites that akm deprecated or removed, and the form that replaces it (regular expressions over a shell command).
old = "\\bakm\\s+clone\\b"
replacement = "\\bakm\\s+import\\b.*--asset-ref"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
workdir = "/work"

[environment.env]
AKM_TASK_STASH = "clone--canary-note"
