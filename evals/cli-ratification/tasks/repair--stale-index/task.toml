schema_version = "1.4"

[task]
name = "akm-eval/repair--stale-index"
version = "1.0.0"
description = "A note filed today is missing from search"
authors = []
keywords = []

[metadata]
family = "repair"
project = "orchid"
# Values that must appear in the output of an akm call, before the answer is written, for the answer to be AKM-mediated; and patterns of
# akm commands, one of which must have run. The trace is read on the host (src/trace.ts); the agent never sees this file.
evidence = []
commands = ["akm\\s+index"]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 720.0

[environment]
workdir = "/work/orchid"

[environment.env]
AKM_TASK_STASH = "repair--stale-index"
