schema_version = "1.4"

[task]
name = "akm-eval/apply--limits-json"
version = "1.0.0"
description = "Write limits.json for tallow from the project's resource limits document"
authors = []
keywords = []

[metadata]
family = "apply"
project = "orchid"
# Values that must appear in the output of an akm call, before the answer is written, for the answer to be AKM-mediated; and patterns of
