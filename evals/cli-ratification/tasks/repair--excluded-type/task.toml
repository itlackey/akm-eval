schema_version = "1.4"

[task]
name = "akm-eval/repair--excluded-type"
version = "1.0.0"
description = "Searches find no notes of one kind"
authors = []
keywords = []

[metadata]
family = "repair"
project = "quill"
# Values that must appear in the output of an akm call, before the answer is written, for the answer to be AKM-mediated; and patterns of
# akm commands, one of which must have run. The trace is read on the host (src/trace.ts); the agent never sees this file.
evidence = []
commands = ["akm\\s+config\\s+(set|unset)"]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 720.0

[environment]
workdir = "/work/quill"

[environment.env]
AKM_TASK_STASH = "repair--excluded-type"
