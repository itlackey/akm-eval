schema_version = "1.4"

[task]
name = "akm-eval/resume--release-4"
version = "1.0.0"
description = "Finish the stopped run of the oriel-release workflow"
authors = []
keywords = []

[metadata]
family = "resume"
project = "quill"
# Values that must appear in the output of an akm call, before the answer is written, for the answer to be AKM-mediated; and patterns of
# akm commands, one of which must have run. The trace is read on the host (src/trace.ts); the agent never sees this file.
evidence = []
commands = ["akm\\s+workflow\\s+(resume|run)"]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 720.0

[environment]
workdir = "/work/quill"

[environment.env]
AKM_TASK_STASH = "resume--release-4"
